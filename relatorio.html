<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Relatorio de Chamados</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="front/css/style.css?v=6" rel="stylesheet">
  <script src="front/js/components/header.js?v=6" defer></script>
  <script src="front/js/components/feedback.js?v=6" defer></script>
</head>

<body>
  <main class="app-shell">
    <div class="container">
      <div id="app-header"></div>

      <section class="page-heading">
        <span class="eyebrow">Relatorios</span>
        <h1 class="page-title">Relatorio de chamados</h1>
        <p class="page-description">
          Filtre atendimentos por periodo e acompanhe o total financeiro dos servicos concluidos.
        </p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label" for="inicio">Data inicio</label>
              <input type="date" id="inicio" class="form-control">
            </div>

            <div class="col-md-4">
              <label class="form-label" for="fim">Data fim</label>
              <input type="date" id="fim" class="form-control">
            </div>

            <div class="col-md-4">
              <button class="btn btn-primary w-100" onclick="gerarRelatorio()">
                <i class="bi bi-search me-2"></i>Gerar relatorio
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Tipo de servico</th>
                <th>Tempo (h)</th>
                <th>Valor (R$)</th>
              </tr>
            </thead>

            <tbody id="tabela-relatorio">
              <tr>
                <td colspan="4" class="text-center text-muted py-4">
                  Selecione um periodo e gere o relatorio.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="panel-footer d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 border-top">
          <span class="badge-soft"><i class="bi bi-cash-coin"></i> Resumo financeiro</span>

          <span class="summary-total" id="total">
            Total: R$ 0.00
          </span>
        </div>
      </section>
    </div>
  </main>

  <script src="front/js/api/config.js?v=6"></script>
  <script src="front/js/api/chamado.js?v=6"></script>
  <script src="front/js/pages/relatorio-page.js?v=6"></script>
</body>

</html>

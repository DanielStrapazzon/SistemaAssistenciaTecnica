<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Tipos de Servico</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="front/css/style.css?v=6" rel="stylesheet">
  <script src="front/js/components/header.js?v=6" defer></script>
  <script src="front/js/components/feedback.js?v=6" defer></script>
</head>

<body>
  <main class="app-shell">
    <div class="container">
      <div id="app-header"></div>

      <section class="page-heading d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
        <div>
          <span class="eyebrow">Configuracao</span>
          <h1 class="page-title">Tipos de servico</h1>
          <p class="page-description">
            Mantenha a tabela de servicos padronizada para agilizar o cadastro dos chamados.
          </p>
        </div>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTipo">
          <i class="bi bi-plus-circle me-2"></i>Novo servico
        </button>
      </section>

      <section class="panel">
        <div class="panel-header d-flex align-items-center justify-content-between gap-3">
          <div>
            <h2 class="section-title">Tabela de servicos</h2>
            <span class="text-muted small">Valores por hora ou preco fixo.</span>
          </div>
          <span class="badge-soft"><i class="bi bi-sliders2"></i> Cadastro</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th style="width: 80px;">ID</th>
                <th>Descricao</th>
                <th>Tipo cobranca</th>
                <th>Valor</th>
                <th class="text-center" style="width: 130px;">Acoes</th>
              </tr>
            </thead>

            <tbody id="tabela-tiposervico"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="modalTipo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title fw-bold">Novo tipo de servico</h5>
            <span class="text-muted small">Cadastre a regra de cobranca.</span>
          </div>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="descricao">Descricao</label>
            <input id="descricao" class="form-control" placeholder="Ex.: Manutencao preventiva">
          </div>

          <div class="mb-3">
            <label class="form-label" for="tipo_cobranca">Tipo de cobranca</label>
            <select id="tipo_cobranca" class="form-select">
              <option value="hora">Por hora</option>
              <option value="fixo">Valor fixo</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label" for="valor">Valor</label>
            <input id="valor" type="number" class="form-control" placeholder="0.00" step="0.01" min="0">
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-2"></i>Cancelar
          </button>
          <button class="btn btn-primary" onclick="salvarTipo()">
            <i class="bi bi-check2-circle me-2"></i>Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="front/js/api/config.js?v=6"></script>
  <script src="front/js/api/tipo-servico.js?v=6"></script>
  <script src="front/js/pages/tiposervico-page.js?v=6"></script>
</body>

</html>
